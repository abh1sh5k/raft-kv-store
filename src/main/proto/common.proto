syntax = "proto3";
package common;
option java_multiple_files = true;

enum Operation {
  NOOP = 0;
  DELETE = 1;
  PUT = 2;
}

message Command {
  Operation operation = 1;

  string key = 2;

  string value = 3;

  string client_id = 4;
  int64 seq_no = 5;

}

message LogEntry {
  int64 term = 1;
  int64 index = 2;

  Command command = 3;
}