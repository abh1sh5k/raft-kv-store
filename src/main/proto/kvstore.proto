syntax = "proto3";

package kvstore;
option java_multiple_files = true;

service kvstore{

  rpc Put(PutRequest)
      returns (PutResponse);
  rpc Delete(DeleteRequest)
      returns (DeleteResponse);
}

message PutRequest{
  string key=1;
  string value=2;
}

message PutResponse{
  bool success=1;
  int64 leaderId=2;
}

message DeleteRequest{
  string key=1;
}

message DeleteResponse{
  bool success=1;
  int64 leaderId=2;
}

