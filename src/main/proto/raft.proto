syntax = "proto3";
import "common.proto";
option java_multiple_files = true;

package raft;

service RaftService {

  rpc RequestVote(VoteRequest)
      returns (VoteResponse);

  rpc AppendEntries(AppendEntriesRequest)
      returns (AppendEntriesResponse);
}

message VoteRequest {
  int64 term = 1;
  int64 candidateId = 2;
  int64 lastLogIndex = 3;
  int64 lastLogTerm = 4;
}

message VoteResponse {
  int64 term = 1;
  bool voteGranted = 2;
}

message AppendEntriesRequest {
  int64 term = 1;
  int64 leaderId = 2;
  int64 prevLogIndex = 3;
  int64 prevLogTerm = 4;

  repeated common.LogEntry entries = 5;

  int64 leaderCommit = 6;
}

message AppendEntriesResponse {
  int64 term = 1;
  bool success = 2;
}